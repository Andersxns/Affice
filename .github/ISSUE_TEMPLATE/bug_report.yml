name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Where?
      options: [Documents, Sheets, Slides, Dashboard / everywhere, Installer]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Affice version
      description: Shown under Home → About.
      placeholder: 1.0.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Ubuntu 24.04 …
  - type: textarea
    id: files
    attributes:
      label: Sample file
      description: If a file doesn't open or save correctly, attach a small example you're happy to share.
