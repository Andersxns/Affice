name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # the Electron binary is not needed to typecheck, test and bundle
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in package.json"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    name: Installers (${{ matrix.name }})
    needs: check
    # installers are built for version tags, manual runs and the default branch
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install rpm tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install dependencies
        run: npm ci
      - name: Build the app
        run: npm run build
      - name: Package for Windows (x64 installer + portable, 32-bit and ARM64 installers)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx electron-builder --win nsis:x64 portable:x64 --publish never
          npx electron-builder --win nsis:ia32 --publish never
          npx electron-builder --win nsis:arm64 --publish never
      - name: Package for Linux (AppImage, deb, rpm, tar.gz)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: affice-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz

  sign:
    name: Sign Windows installers
    needs: package
    # releases only, once SignPath is set up (see "Setting up code signing" in CONTRIBUTING.md);
    # every signing request is approved by hand in SignPath
    if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 250
    permissions:
      actions: read
      contents: read
    steps:
      - name: Find the unsigned installers
        id: unsigned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "affice-Windows") | .id')
          test -n "$id"
          echo "artifact-id=$id" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Sign with SignPath (waits for the request to be approved)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'affice' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.unsigned.outputs.version) }}
      - uses: actions/upload-artifact@v4
        with:
          name: affice-Windows-signed
          path: signed/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [package, sign]
    # after signing, or with unsigned Windows installers while SignPath isn't set up
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.package.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          name: affice-Linux
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sign.result == 'success' && 'affice-Windows-signed' || 'affice-Windows' }}
          path: artifacts
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release name and notes
        id: notes
        env:
          SIGNED: ${{ needs.sign.result == 'success' }}
        run: |
          echo "name=Affice ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          # a version's own notes (docs/releases/<tag>.md) go above the generated list of changes;
          # their "<!-- signing -->" line says whether the Windows installers are signed
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            if [ "$SIGNED" = true ]; then
              signing='The Windows installers are code-signed: free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).'
            else
              signing="The Windows installers in this release aren't code-signed, so SmartScreen may warn you the first time: choose **More info → Run anyway**."
            fi
            sed "s|<!-- signing -->|$signing|" "$notes" > release-notes.md
            echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: artifacts/*
          generate_release_notes: true
